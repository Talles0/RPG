<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Ferramenta Foda - Player</title>
</head>
<body>
    <rpg-header></rpg-header>
    <main>
        <section id="section-nova-mesa">
            <h2>Entrar em uma nova mesa:</h2>
            <form action="">
                <label for="codigo-sala">Código da Mesa</label>
                <input id="codigo-sala" name="codigo-sala" type="number">
                <button type="submit">Entrar</button>
            </form>
        </section>
        <hr>
        <section id="section-personagens">
            <h2>Personagens já criados:</h2>
            <div id="exemplo-personagem1" class="personagem-criado">
                    <img src="https://preview.redd.it/things-you-did-in-hollow-knight-that-you-dont-want-to-v0-26p7ti563tlf1.jpeg?auto=webp&s=8803de8fa42668303496176d2434dd6728128e46" alt="imagem-personagem">
                    <h3 class="nome-personagem">O Cavaleiro</h3>
                    <h4 class="rotulo-sistema">Sistema:</h4>
                    <p class="sistema-personagem">D&D 5e</p>
                    <a class="botao-acessar-personagem" href="">Acessar</a>
                </div>
            <div id="exemplo-personagem2" class="personagem-criado">
                    <img src="https://media.discordapp.net/attachments/974792984971313214/1557508886615822356/image.png?backend=b2&ex=6aeba72f&is=6aea55af&hm=a323a045f886d12df4a83970c43688d3b1458edf7d1c3c609b6efd34455977ca&=&format=webp&quality=lossless" alt="imagem-personagem">
                    <h3 class="nome-personagem">Rodolfo</h3>
                    <h4 class="rotulo-sistema">Sistema:</h4>
                    <p class="sistema-personagem">Personalizado</p>
                    <a class="botao-acessar-personagem" href="#">Acessar</a>
                </div>
        </section>
    </main>
</body>
<script src="/src/components/components.js"></script>
</html>
